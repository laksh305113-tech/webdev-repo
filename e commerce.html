<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="styles.css">
    <title>Simple E-Commerce Store</title>
</head>
<body>
    <header>
        <!-- Navigation Bar -->
        <nav>
            <h1>My Store</h1>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="#">Sign In</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Product Listing Section -->
        <section class="product-listing">
            <h2>Featured Products</h2>
            
            <!-- Example Product Card -->
            <div class="product">
                <img src="product1.jpg" alt="Product 1 Image">
                <h3>Product Name 1</h3>
                <p>Description of product 1.</p>
                <div class="price">$19.99</div>
                <a href="#" class="add-to-cart-btn">Add to Cart</a>
            </div>

            <!-- You would repeat the above 'div.product' for other products -->
            <div class="product">
                <img src="product2.jpg" alt="Product 2 Image">
                <h3>Product Name 2</h3>
                <p>Description of product 2.</p>
                <div class="price">$29.99</div>
                <a href="#" class="add-to-cart-btn">Add to Cart</a>
            </div>
        </section>
    </main>

    <footer>
        <!-- Footer content like contact info, links, etc. -->
        <p>&copy; 2026 My Store. All rights reserved.</p>
    </footer>

    <!-- Link to your JavaScript file if needed -->
    <script src="script.js"></script>
</body>
</html>
